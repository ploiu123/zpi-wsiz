# Konfiguracja electron-builder dla aplikacji desktopowej "Złote Miody".
# Jedyne źródło prawdy — klucz "build" został usunięty z package.json,
# żeby nie było dwóch konkurujących konfiguracji.

appId: pl.zlotemiody.sklep
productName: Złote Miody

directories:
  output: release

# Dokładnie to, co leży w katalogu i jest potrzebne w czasie działania.
# main.js i preload.js w katalogu głównym to wynik `npm run obfuscate`
# (źródła: src/main.js, src/preload.js). Zły wpis tutaj = biały ekran po starcie.
files:
  - main.js
  - preload.js
  - splash.html
  - icon.png

mac:
  category: public.app-category.shopping
  icon: icon.png
  identity: null          # bez podpisu — build lokalny i CI bez certyfikatu
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64

dmg:
  title: Złote Miody
  icon: icon.png
  window:
    width: 540
    height: 400
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Złote Miody

linux:
  icon: icon.png
  category: Shopping
  target:
    - target: AppImage
      arch:
        - x64
