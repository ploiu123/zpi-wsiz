appId: pl.zlotemiody.sklep
productName: Złote Miody

directories:
  output: release

files:
  - main.js
  - preload.js
  - splash.html
  - icon.png

mac:
  category: public.app-category.shopping
  icon: icon.png
  identity: null
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - x64
        - arm64

dmg:
  title: Złote Miody
  icon: icon.png
  window:
    width: 540
    height: 400
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Złote Miody

linux:
  icon: icon.png
  category: Shopping
  target:
    - target: AppImage
      arch:
        - x64
