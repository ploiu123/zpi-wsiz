name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Aplikacja desktopowa jest cienkim wrapperem — ładuje żywą stronę przez loadURL,
  # nie pakuje builda Next.js. Każdy system buduje własny artefakt na własnym runnerze.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            artifact: ZloteMiody-Windows
            files: desktop-app/release/*.exe
          - os: macos-latest
            flag: --mac
            artifact: ZloteMiody-macOS
            files: desktop-app/release/*.dmg
          - os: ubuntu-latest
            flag: --linux
            artifact: ZloteMiody-Linux
            files: desktop-app/release/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Instalacja zależności
        working-directory: desktop-app
        run: npm ci

      - name: Zaciemnienie źródeł (src/ -> main.js, preload.js)
        working-directory: desktop-app
        run: npm run obfuscate

      - name: Budowa aplikacji
        working-directory: desktop-app
        env:
          # Bez tego electron-builder na macOS szuka certyfikatu w pęku kluczy
          # i przerywa build, gdy go nie znajdzie. Artefakty są niepodpisane.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  # Osobne zadanie: sprawdza, że sklep Next.js w ogóle się buduje, zanim Vercel
  # to wykryje. Tu — i tylko tu — potrzebne są klucze Supabase.
  web:
    name: Build sklepu (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testy koszyka
        run: npm test

      - name: Build produkcyjny
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
